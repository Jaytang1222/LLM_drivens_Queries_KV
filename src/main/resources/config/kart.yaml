# Unified KART config (layout + planner + regions).
hbase:
  site_xml: src/main/resources/config/hbase/hbase-site.xml
catalog:
  dir: catalog
layout:
  shard_count: 4
  chunk_max_points: 256
  bucket_ms: 600000
  zorder_level: 8
  xz_level: 12
  tshape_max_depth: 12
  xzt_level: 12
  hash_version: murmur3_x64_128
  crs: EPSG:32650
  # domain filled by profile-data / fixture (meters in UTM 50N)
  domain:
    xmin: 0.0
    xmax: 100.0
    ymin: 0.0
    ymax: 100.0
  table_suffix: _v1
planner:
  # §13.4 cost coefficients (authoritative: FitCostCmd / FeedbackCalibrator; pack experiments/results/cost_calib_pack_20260925; freeze during experiments)
  max_llm_calls: 6
  max_candidates: 8
  # ADV FastCost is memoized + range-indexed + posting-only; avoid idle 15s budgets.
  max_plan_ms: 1500
  beam_width: 3
  stagnation_steps: 2
  max_candidate_chunks: 500000
  max_dtw_cells: 500000000
  max_zorder_ranges: 64
  fetch_batch_size: 500
  cost:
    calibrated: true
    model_version: cost_v2_rs_sched
    concurrency_index: 4
    concurrency_get: 4
    concurrency_per_rs: 2
    alpha_rpc: 8.0
    alpha_seek: 0.5625
    alpha_byte: 1.2750000000000008e-05
    alpha_decode: 0.0006000000000000004
    beta_hash: 7.75e-05
    beta_emit: 1.3109474999999915
    beta_spill: 1e-08
    beta_sort_merge: 0.00002
    gamma_rpc: 12.62500000000001
    gamma_byte: 0.001047000000000003
    gamma_decode: 1.6406999999999958
    delta_point: 0.05342499999999976
    delta_geometry: 0.00005
    rho_linear: 0.0
    eta_cell: 0.001160000000000005
    eta_cell_dtw: 0.0
    eta_cell_frechet: 0.000012
    eta_cell_hausdorff: 0.000008
    theta_heap: 0.15425000000000003
    soft_memory_bytes: 2000000000
    max_exec_ms: 120000
    # legacy aliases retained for older readers
    c_scan: 1.0
    c_row: 0.01
    c_get: 0.05
    c_byte: 0.000001
    c_point: 0.0001
    c_dtw: 0.00001

# Pre-registered region names → WGS84 lon/lat rectangles (OI-10).
#
# MVP does NOT call geocoding APIs. Names below are approximate axis-aligned
# envelopes derived from publicly listed WGS84 centers (± a few km), for NL demos
# on T-Drive (Beijing 2008). They are NOT cadastral / 行政区划 official boundaries.
#
# Sources (centers / notes, 2026-09):
# - Zhongguancun: latlong.net ≈ (39.983246, 116.315506); Baidu Baike subdistrict description
# - Wangjing: geocountries / gps-latitude-longitude ≈ (39.993, 116.47)
# - Guomao / CBD: Wikipedia / Wikidata ≈ (39.909819, 116.455572)
# - Tiananmen area: commonly cited ≈ (39.9044, 116.3914)
# - Capital Airport (PEK): Wikipedia / latlong.net ≈ (40.07250, 116.59750)
# - beijing_core: existing MVP envelope (inner-city demo box)
# - tdrive_smoke_anchor: WGS84 envelope of smoke h_st_1 UTM box (chat-verifiable vs oracle)
# - tdrive_topk_box: WGS84 envelope of smoke topk_st_1 / h_s_small UTM box
# - tdrive_topk_wide: WGS84 envelope of smoke topk_st_2 UTM box
# - tdrive_topk_s1: WGS84 envelope of smoke topk_s_1 UTM box
# - tdrive_topk_mid: WGS84 envelope of smoke topk_st_3 UTM box
#
