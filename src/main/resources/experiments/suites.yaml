# Formal experiment suites (select with --suite <id>).
suites:
  parse:
    kind: compare
    id: parse
    workload: datasets/tdrive-query/E1_query.json
    oracle: datasets/tdrive-query/E1_query.json
    manifest: tdrive_v1_ready
    require_oracle: false
    trials: 1
    stages:
      - parse
    arms:
      - kart
      - direct-draftir
      - din-sql-spider
      - din-sql-bird
      - sag-mql-nofeedback
      # requires real WorldAccess (not sample JSON):
      # - sag-mql
      # diagnostic DraftIR-direct (legacy):
      # - din-spider
      # - din-bird
      # - sag

  plan:
    kind: compare
    id: plan
    workload: datasets/tdrive-query/complex_query.json
    oracle: datasets/tdrive-query/complex_query.json
    manifest: tdrive_v1_ready
    require_oracle: false
    trials: 10
    stages:
      - plan
    arms:
      - kart
      - cbo
      - bao
      - llmopt

  plan-simple:
    kind: compare
    id: plan-simple
    workload: datasets/tdrive-query/simple_query.json
    oracle: datasets/tdrive-query/simple_query.json
    manifest: tdrive_v1_ready
    require_oracle: true
    trials: 10
    stages:
      - plan
    arms:
      - kart
      - cbo
      - rbo
      - fullscan

  e2e:
    kind: compare
    id: e2e
    workload: datasets/tdrive-query/complex_query.json
    oracle: datasets/tdrive-query/complex_query.json
    manifest: tdrive_v1_ready
    require_oracle: true
    trials: 10
    stages:
      - e2e
    arms:
      - fullscan
      - rbo
      - cbo
      - kart

  e2e-simple:
    kind: compare
    id: e2e-simple
    workload: datasets/tdrive-query/simple_query.json
    oracle: datasets/tdrive-query/simple_query.json
    manifest: tdrive_v1_ready
    require_oracle: true
    trials: 10
    stages:
      - e2e
    arms:
      - kart
      - cbo
      - rbo
      - fullscan

  e2e-learned:
    kind: compare
    id: e2e-learned
    workload: datasets/tdrive-query/complex_query.json
    oracle: datasets/tdrive-query/complex_query.json
    manifest: tdrive_v1_ready
    require_oracle: true
    trials: 10
    stages:
      - e2e
    arms:
      - fullscan
      - rbo
      - cbo
      - bao
      - paramtree
      - kart

  e2e-learned-simple:
    kind: compare
    id: e2e-learned-simple
    workload: datasets/tdrive-query/simple_query.json
    oracle: datasets/tdrive-query/simple_query.json
    manifest: tdrive_v1_ready
    require_oracle: true
    trials: 10
    stages:
      - e2e
    arms:
      - fullscan
      - rbo
      - cbo
      - bao
      - paramtree
      - kart

  ablation:
    kind: ablation
    id: ablation
    # Same frozen comparative set as E2/E3 (bound_ir_complex_v3, 2026-10-17).
    workload: datasets/tdrive-query/complex_query.json
    oracle: datasets/tdrive-query/complex_query.json
    manifest: tdrive_v1_ready
    require_oracle: true
    trials: 10
    stages:
      - e2e
    base_arm: kart
    factors:
      # KART w/o rule LLM — drop offline admitted rewrite rules
      - id: no_rule_llm
        enabled: true
        overrides:
          action_mode: dual-online-only
      # KART w/o costmodel LLM — drop offline LLM CostPatch (KART_COST_PATCH)
      - id: no_costmodel_llm
        enabled: true
        overrides:
          cost_patch: false
      # KART w/o costmodel — native CBO arm (no AdvFinalCalibrator; not kart+plan_id)
      - id: no_costmodel
        enabled: true
        overrides:
          arm: cbo
      # KART w/o verify — CoverageCheck off (risk table only)
      - id: no_verify
        enabled: true
        unsafe: true
        overrides:
          skip_coverage_check: true

  ablation-simple:
    kind: ablation
    id: ablation-simple
    # Same frozen comparative set as E2/E3 (bound_ir_simple_v3, 2026-10-17).
    workload: datasets/tdrive-query/simple_query.json
    oracle: datasets/tdrive-query/simple_query.json
    manifest: tdrive_v1_ready
    require_oracle: true
    trials: 10
    stages:
