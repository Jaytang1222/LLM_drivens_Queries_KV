      - id: no_costmodel_llm
        enabled: true
        overrides:
          cost_patch: false
      - id: no_costmodel
        enabled: true
        overrides:
          arm: cbo
      - id: no_verify
        enabled: true
        unsafe: true
        overrides:
          skip_coverage_check: true

  param:
    kind: param
    id: param
    # Same frozen comparative set as E2/E3 (bound_ir_complex_v3, 2026-10-17).
    workload: datasets/tdrive-query/complex_query.json
    oracle: datasets/tdrive-query/complex_query.json
    manifest: tdrive_v1_ready
    require_oracle: true
    trials: 10
    stages:
      - e2e
    base_arm: kart
    grid_mode: oat
    # Align with kart.yaml planner defaults (beam=3, max_candidates=8).
    # OAT grids center on defaults with step 2: beam 1–3–5(–7), mc 4–6–8–10.
    defaults:
      beam_width: 3
      max_candidates: 8
    grid:
      beam_width: [1, 3, 5, 7]
      max_candidates: [4, 6, 8, 10]

