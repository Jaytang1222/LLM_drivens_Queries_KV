    workload: datasets/porto-query/simple_query.json
    oracle: datasets/porto-query/simple_query.json
    manifest: porto_v1_ready
    require_oracle: true
    trials: 1
    stages:
      - e2e
    # Train experience for Bao/ParamTree (disjoint from formal complex).
