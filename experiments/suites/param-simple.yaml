# Parameter OAT sweep — simple layer (eval_level=simple).
# Formal defaults (3,4,4) are cell overlays; does not rewrite config/planner.yaml.
# Formal first-run: --cache cold --trials 1.
kind: param
id: param-simple
workload: experiments/workloads/bound_ir_simple_v2.json
oracle: experiments/workloads/bound_ir_simple_v2.oracle.json
manifest: tdrive_v1_ready
require_oracle: true
trials: 1
stages:
  - e2e
base_arm: kart
grid_mode: oat
defaults:
  beam_width: 3
  max_candidates: 4
  max_llm_calls: 4
grid:
  beam_width: [1, 3, 5, 7]
  max_candidates: [4, 6, 8, 10]
  max_llm_calls: [0, 4, 8, 12]
