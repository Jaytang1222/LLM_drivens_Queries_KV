# Planning-layer leave-one-out (spec/ablation_experiment.md)
# Formal first-run: --cache cold --trials 1
# Formal warm P50/P95: --cache warm --trials 5
# Risk arm no_coverage: --allow-unsafe --factor no_coverage
kind: ablation
id: ablation
workload: experiments/workloads/bound_ir_v1.json
oracle: experiments/workloads/bound_ir_v1.oracle.json
manifest: tdrive_v1_ready
require_oracle: true
trials: 3
stages:
  - e2e
base_arm: kart
factors:
  - id: no_llm_rule
    enabled: true
    overrides:
      policy: rule
  - id: no_llm_best_first
    enabled: true
    overrides:
      policy: best_first
  - id: llm_direct
    enabled: true
    overrides:
      policy: llm_direct
  - id: no_fast_cost
    enabled: true
    overrides:
      use_fast_cost: false
  - id: no_final_cost
    enabled: true
    overrides:
      final_select: plan_id
  - id: single_index
    enabled: true
    overrides:
      allow_intersect: false
  - id: uncalibrated
    enabled: true
    overrides:
      uncalibrated: true
  - id: no_coverage
    enabled: true
    unsafe: true
    overrides:
      skip_coverage_check: true
