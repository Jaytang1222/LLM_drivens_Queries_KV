# Dual-rewrite leave-one-out (spec/ablation_experiment.md)
# Full = kart (CBO + offline admitted rules + online residual LLM).
# Do not run a formal table until cache/oracle gates are explicit.
# Risk arm no_coverage: --allow-unsafe --factor no_coverage
kind: ablation
id: ablation
workload: experiments/workloads/bound_ir_cmp_v3.json
oracle: experiments/workloads/bound_ir_cmp_v3.oracle.json
manifest: tdrive_v1_ready
require_oracle: true
trials: 3
stages:
  - e2e
base_arm: kart
factors:
  - id: cbo_only
    enabled: true
    overrides:
      action_mode: cbo_only
  - id: no_online_llm
    enabled: true
    overrides:
      action_mode: dual-offline-rules
  - id: no_fast_cost
    enabled: true
    overrides:
      use_fast_cost: false
  - id: no_final_cost
    enabled: true
    overrides:
      final_select: plan_id
  - id: no_coverage
    enabled: true
    unsafe: true
    overrides:
      skip_coverage_check: true
