# Pre-registered region names → WGS84 lon/lat rectangles (OI-10).
#
# MVP does NOT call geocoding APIs. Names below are approximate axis-aligned
# envelopes derived from publicly listed WGS84 centers (± a few km), for NL demos
# on T-Drive (Beijing 2008). They are NOT cadastral / 行政区划 official boundaries.
#
# Sources (centers / notes, 2026-09):
# - Zhongguancun: latlong.net ≈ (39.983246, 116.315506); Baidu Baike subdistrict description
# - Wangjing: geocountries / gps-latitude-longitude ≈ (39.993, 116.47)
# - Guomao / CBD: Wikipedia / Wikidata ≈ (39.909819, 116.455572)
# - Tiananmen area: commonly cited ≈ (39.9044, 116.3914)
# - Capital Airport (PEK): Wikipedia / latlong.net ≈ (40.07250, 116.59750)
# - beijing_core: existing MVP envelope (inner-city demo box)
# - tdrive_smoke_anchor: WGS84 envelope of smoke h_st_1 UTM box (chat-verifiable vs oracle)
# - tdrive_topk_box: WGS84 envelope of smoke topk_st_1 / h_s_small UTM box
# - tdrive_topk_wide: WGS84 envelope of smoke topk_st_2 UTM box
# - tdrive_topk_s1: WGS84 envelope of smoke topk_s_1 UTM box
# - tdrive_topk_mid: WGS84 envelope of smoke topk_st_3 UTM box
#
